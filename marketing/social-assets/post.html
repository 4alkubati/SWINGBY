<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Grotesk';src:url('assets/SpaceGrotesk-Bold.ttf');font-weight:700}
  @font-face{font-family:'Grotesk';src:url('assets/SpaceGrotesk-Medium.ttf');font-weight:500}
  @font-face{font-family:'Inter';src:url('assets/Inter-Regular.ttf');font-weight:400}
  @font-face{font-family:'Inter';src:url('assets/Inter-SemiBold.ttf');font-weight:600}

  /* Jet x Pulse tokens — design/DESIGN-SYSTEM.md. Purple is reserved for one
     accent per frame; money is green; zero emoji anywhere. */
  :root{
    --bg:#07080a; --surface:#0F1115; --border:#1F232B;
    --pulse:#6E56F7; --money:#2EBD85;
    --ink:#F4F6FA; --ink2:#8C93A1;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px}
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;
    overflow:hidden; position:relative;
  }
  /* one soft pulse bloom, top-left, so the frame isn't a flat rectangle */
  .bloom{
    position:absolute; width:1100px; height:1100px; left:-380px; top:-460px;
    background:radial-gradient(circle at center, rgba(110,86,247,.30), rgba(110,86,247,0) 62%);
    filter:blur(10px);
  }
  .grid{
    position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:72px 72px;
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,#000 40%,transparent 100%);
  }
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;padding:64px 72px 58px}

  .brand{display:flex;align-items:center;gap:14px;margin-bottom:40px}
  .brand .mark{font-family:'Grotesk';font-weight:700;font-size:38px;letter-spacing:-.02em}
  .brand .mark span{color:var(--pulse)}
  .brand .loc{
    font-size:20px;color:var(--ink2);border-left:1px solid var(--border);
    padding-left:14px;letter-spacing:.02em;
  }

  .body{display:flex;gap:52px;align-items:center;flex:1}
  .copy{flex:1.25;min-width:0}
  .eyebrow{
    font-family:'Inter';font-weight:600;font-size:19px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--pulse);margin-bottom:26px;
  }
  h1{
    font-family:'Grotesk';font-weight:700;font-size:62px;line-height:1.07;
    letter-spacing:-.032em;margin-bottom:28px;
  }
  h1 .g{color:var(--money)}
  p.sub{font-size:25px;line-height:1.45;color:var(--ink2);max-width:24ch}

  .proof{
    margin-top:46px;display:flex;flex-direction:column;gap:14px;
    border-top:1px solid var(--border);padding-top:26px;
  }
  .proof div{display:flex;align-items:center;gap:15px;font-size:25px;color:var(--ink)}
  .tick{
    width:26px;height:26px;border-radius:50%;flex:none;
    border:2px solid var(--money);position:relative;
  }
  .tick::after{
    content:'';position:absolute;left:7px;top:4px;width:6px;height:12px;
    border-right:2px solid var(--money);border-bottom:2px solid var(--money);
    transform:rotate(42deg);
  }

  /* the device: a thin bezel, no glossy skeuomorphic phone chrome */
  .device{
    position:relative;
    width:440px;flex:none;border-radius:46px;padding:11px;
    background:linear-gradient(160deg,#2b2f3a,#0d0f14 55%);
    box-shadow:0 50px 90px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.05);
    transform:none;
  }
  .device img{width:100%;display:block;border-radius:36px;
    height:var(--shot-h,auto);object-fit:cover;object-position:top center}
  /* the screen dissolves into the page — keeps the eye on the progress rail
     and takes the lower rows out without a fake-looking crop */
  .device::after{
    content:'';position:absolute;left:11px;right:11px;bottom:11px;height:60%;
    border-radius:0 0 36px 36px;pointer-events:none;
    background:linear-gradient(to bottom, rgba(7,8,10,0) 0%, rgba(7,8,10,.55) 18%,
               rgba(7,8,10,.93) 38%, #07080a 55%);
  }

  footer{
    margin-top:auto;padding-top:34px;display:flex;justify-content:space-between;
    align-items:center;font-size:22px;color:var(--ink2);
  }
  footer .url{color:var(--ink);font-weight:600}
</style></head>
<body>
  <div class="bloom"></div><div class="grid"></div>
  <div class="wrap">
    <div class="brand">
      <div class="mark">Swing<span>By</span></div>
      <div class="loc">Calgary</div>
    </div>

    <div class="body">
      <div class="copy">
        <div class="eyebrow" id="eyebrow">Happening now</div>
        <h1 id="head">Watch the job<br>actually <span class="g">happen</span>.</h1>
        <p class="sub" id="sub">Confirmed, on the way, in progress, done — live, not a phone call.</p>
        <div class="proof" id="proof"></div>
      </div>
      <div class="device"><img id="shot" src="assets/03-live-booking.png" alt=""></div>
    </div>

    <footer>
      <div id="foot">Post a job free · Calgary trades</div>
      <div class="url">swingbyy.com</div>
    </footer>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const set = (id,v) => { if(v) document.getElementById(id).innerHTML = v; };
  set('eyebrow', q.get('eyebrow')); set('head', q.get('head'));
  set('sub', q.get('sub')); set('foot', q.get('foot'));
  if (q.get('shot')) document.getElementById('shot').src = 'assets/' + q.get('shot');
  if (q.get('croph')) document.getElementById('shot').style.setProperty('--shot-h', q.get('croph')+'px');
  const proof = q.get('proof');
  if (proof) document.getElementById('proof').innerHTML =
    proof.split('|').map(t => `<div><span class="tick"></span>${t}</div>`).join('');
</script>
</body></html>
