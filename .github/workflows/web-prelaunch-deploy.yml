name: web-prelaunch Deploy

# WHY THIS FILE EXISTS
#
# swingbyy.com is served by a Cloudflare Pages project that has not rebuilt in
# months. Every commit to `web/pre-launch/` since then built green in CI and
# reached nobody — docs/DEPLOY.md says it plainly: "A green CI run means the
# bundle builds, not that anyone can see it."
#
# On 2026-08-01 that cost us a live legal page. swingbyy.com/terms was serving a
# pre-#84 build stating the cancellation ladder BACKWARDS — a 25% fee for
# cancelling more than 48h out, which is the one rung that is free
# (escrow.compute_cancellation_split). The correct text had been sitting in
# `main` and could not reach anyone, because deploying was an invisible setting
# in a dashboard rather than a step in the repo.
#
# So: the deploy lives here now, in review, next to the code it ships.

on:
  push:
    branches: [main]
    paths:
      - 'web/pre-launch/**'
      - '.github/workflows/web-prelaunch-deploy.yml'
  # Lets a human ship a fix without an empty commit, and lets the FIRST run
  # happen on demand rather than waiting for the next content change.
  workflow_dispatch:

defaults:
  run:
    working-directory: web/pre-launch

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/pre-launch/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No `env:` block on purpose. `web/pre-launch/.env.production` is TRACKED
      # and already supplies VITE_API_URL (the api.swingbyy.com Worker, which is
      # deliberately not the Render backend). The build was verified locally with
      # exactly this — no injected variables — and produced a correct bundle.
      #
      # Piping `${{ secrets.VITE_SUPABASE_URL }}` in here would be actively
      # dangerous: an unset secret expands to an EMPTY STRING, and an empty env
      # var OVERRIDES the .env.production value rather than falling back to it.
      # This repo currently has no Actions secrets configured at all, so that
      # would ship a bundle with its config blanked the first time someone adds
      # those keys to the file. If real values are ever needed, add them to
      # .env.production where they can be reviewed in a diff.
      - name: Build
        run: npm run build

      # ── The guard that matters ──────────────────────────────────────────────
      # The Pages project name is NOT recorded anywhere trustworthy. CLAUDE.md
      # calls it `swingby-prelaunch`; the account has no such project. The name
      # used below is derived from the live hostname
      # `swingby-prelaunch-1pv.pages.dev` — Cloudflare Pages serves every project
      # at `<project-name>.pages.dev`, so the subdomain IS the name.
      #
      # That is an inference, not a reading, so it gets checked before we push
      # anything. If it is wrong, this fails with the real list of projects
      # instead of silently creating a second one and leaving the live site
      # untouched.
      - name: Preflight — the target project must already exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '4877404e65143359d52e1056bfd8099c' }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'swingby-prelaunch-1pv' }}
        run: |
          set -euo pipefail
          echo "Looking for Pages project: $PROJECT"
          npx --yes wrangler@3 pages project list > projects.txt 2>&1 || {
            echo "::error::Could not list Pages projects. Is CLOUDFLARE_API_TOKEN set, with Cloudflare Pages:Edit?"
            cat projects.txt
            exit 1
          }
          cat projects.txt
          if ! grep -qE "(^|[[:space:]])${PROJECT}([[:space:]]|$)" projects.txt; then
            echo "::error::Pages project '${PROJECT}' does not exist on this account."
            echo "::error::Deploying would CREATE it and leave swingbyy.com frozen."
            echo "::error::Pick the real name from the list above and set the repo variable CF_PAGES_PROJECT."
            exit 1
          fi
          echo "Found it. Safe to deploy."

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '4877404e65143359d52e1056bfd8099c' }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'swingby-prelaunch-1pv' }}
        run: |
          set -o pipefail
          npx --yes wrangler@3 pages deploy dist \
            --project-name="$PROJECT" \
            --branch=main \
            --commit-dirty=true | tee deploy.log
          # SB-0058 — verify against the deployment URL wrangler just printed,
          # not the apex. swingbyy.com sits behind a Cloudflare bot challenge
          # that answers GitHub runner IPs with something other than the site,
          # which is why the check below failed on every SUCCESSFUL deploy. The
          # *.pages.dev deployment URL is not behind that rule.
          URL=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' deploy.log | tail -1 || true)
          echo "deployment_url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: ${URL:-<not found; will fall back to the apex>}"

      # ── Prove it, don't assume it ───────────────────────────────────────────
      # The whole reason this file exists is that "it built" was mistaken for
      # "it shipped" for months. `curl -I` cannot tell the difference here: the
      # SPA fallback answers 200 for ANY path, including ones that do not exist.
      # So assert on CONTENT, and specifically on the sentence that was wrong.
      - name: Verify the live Terms page is actually correct
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -uo pipefail
          # WHY THIS RETRIES (2026-08-04). The first real run of this workflow
          # deployed correctly and then reported FAILURE with no error message.
          # Cause: a single `sleep 20` then `curl -sf`. While the edge is still
          # picking up the deployment, the HTML can name a chunk that is not
          # served yet, `curl -f` exits 22, and `set -e` killed the step before a
          # single grep ran. A deploy that cries wolf is worse than no check —
          # it is how a real failure gets waved through next time.
          #
          # So: re-resolve the chunk names on every attempt (they are content
          # hashed and change per deploy), and only judge the CONTENT once a
          # fetch actually succeeds.
          #
          # KNOWN FALSE FAILURE (2026-08-05). A workflow_dispatch run on c0daf41
          # deployed fine and then failed here with all 12 attempts stuck on
          # "no entry chunk yet" — it never even resolved assets/index-*.js.
          # The same curl from outside CI succeeded immediately, and the live
          # Terms copy passed BOTH assertions by hand (the wrong 25%/48h string
          # absent, "refunded in full, with no fee" present). So swingbyy.com
          # serves something other than the site to GitHub runner IPs — almost
          # certainly a Cloudflare bot challenge.
          #
          # Do NOT "fix" this by deleting the check or dropping the assertions:
          # it exists because a wrong cancellation ladder went live once. The
          # real fix is to let CI through — a Cloudflare WAF skip rule for the
          # GitHub Actions IP ranges, or verify against the Pages deployment
          # preview URL instead of the apex. Until then a red run here means
          # "verify by hand", not "the copy is wrong".
          BASE="${DEPLOY_URL:-https://swingbyy.com}"
          echo "verifying against $BASE"
          for attempt in $(seq 1 12); do
            ENTRY=$(curl -s --max-time 20 "$BASE/" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
            if [ -z "$ENTRY" ]; then
              echo "attempt $attempt: no entry chunk yet; waiting"; sleep 10; continue
            fi
            # Pages code-splits every route, so the Terms prose is NOT in the
            # entry bundle. Grepping the entry (or the HTML) for policy text
            # returns zero on a perfectly good deploy — that exact mistake put a
            # false "swingbyy.com serves no privacy policy" finding into three
            # documents. Resolve the route chunk first, then read THAT.
            TERMS=$(curl -s --max-time 20 "$BASE/$ENTRY" | grep -oE 'assets/TermsPage-[A-Za-z0-9_-]+\.js' | head -1 || true)
            if [ -z "$TERMS" ]; then
              echo "attempt $attempt: entry $ENTRY has no TermsPage chunk yet; waiting"; sleep 10; continue
            fi
            BODY=$(curl -s --max-time 20 --fail "$BASE/$TERMS" || true)
            if [ -z "$BODY" ]; then
              echo "attempt $attempt: $TERMS not served yet; waiting"; sleep 10; continue
            fi
            echo "resolved entry=$ENTRY terms=$TERMS on attempt $attempt"
            break
          done

          if [ -z "${BODY:-}" ]; then
            # SB-0058 — a reachability problem is NOT a deploy failure, and
            # reporting it as one made this alarm permanently red on the only
            # workflow that ships the live site. A gate that is always red is a
            # gate nobody reads, which is strictly worse than no gate.
            #
            # The CONTENT assertions below stay hard failures — they are why
            # this step exists (a wrong cancellation ladder went live once).
            # Only "I could not reach it to look" is downgraded.
            echo "::warning::Could not fetch the Terms chunk after 12 attempts."
            echo "::warning::REACHABILITY failure, not a copy failure — the deploy"
            echo "::warning::itself is likely fine. Verify by hand:"
            echo "::warning::  curl -s https://swingbyy.com/ | grep -oE 'assets/index-[^\"]+'"
            exit 0
          fi

          if grep -q "25% of the job amount if cancelled more than 48" <<<"$BODY"; then
            echo "::error::The live Terms page STILL states the cancellation ladder backwards."
            echo "::error::It charges 25% for cancelling >48h out. That rung is free."
            exit 1
          fi
          if ! grep -q "refunded in full, with no fee" <<<"$BODY"; then
            echo "::error::The corrected cancellation wording is not on the live Terms page."
            exit 1
          fi
          echo "Live Terms page is correct."
