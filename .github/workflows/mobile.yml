name: Mobile CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    name: doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-fund

      - name: Expo doctor
        working-directory: mobile
        run: npx --yes expo-doctor
        continue-on-error: true

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: doctor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-fund

      - name: Read package.json scripts
        id: pkg
        run: |
          echo "scripts=$(node -e "const p=require('./mobile/package.json'); console.log(JSON.stringify(p.scripts||{}))")" >> $GITHUB_OUTPUT

      - name: Run typecheck script
        if: contains(steps.pkg.outputs.scripts, '"typecheck"')
        working-directory: mobile
        run: npm run typecheck

      - name: Fallback tsc --noEmit
        if: "!contains(steps.pkg.outputs.scripts, '\"typecheck\"') && hashFiles('mobile/tsconfig.json') != ''"
        working-directory: mobile
        run: npx tsc --noEmit

  # The jest suite. This job did not exist until 2026-07-26, which meant Mobile
  # CI had never run a single mobile test: the `typecheck` job above gates both
  # of its steps on a `typecheck` script or a tsconfig.json, and this project has
  # neither — so the job did nothing and reported success. Every "Mobile CI
  # green" before this commit was green on an empty job.
  #
  # No `continue-on-error` here on purpose. A test job that cannot fail the
  # build is the same as no test job, which is exactly the hole being closed.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: doctor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-fund

      # `npm ci` has produced a node_modules with no .bin links on this project
      # before (exit 0, then "expo: not found"). npm install is used above for
      # that reason; this makes the jest binary's absence loud rather than a
      # confusing failure inside the test run.
      - name: Verify the test runner is installed
        working-directory: mobile
        run: npx jest --version

      - name: Jest
        working-directory: mobile
        run: npm run test:ci
