name: web-launch CI

on:
  workflow_dispatch:
  # SB-0061 — `push` had no branch filter, so every push to every branch ran
  # this in addition to the pull_request run: two identical runs per PR commit,
  # doubling queue time and CI spend for no extra signal.
  push:
    branches:
      - main
    paths:
      - 'web/launch/**'
      - 'backend/**'
      - '.github/workflows/web-launch-ci.yml'
  pull_request:
    paths:
      - 'web/launch/**'
      - 'backend/**'
      - '.github/workflows/web-launch-ci.yml'

# SB-0061 — without this, pushing three commits in a minute leaves three full
# runs racing; the oldest can report last and win the branch's status.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SB-0062 — least privilege. An unset `permissions:` inherits the repository
# default, which is often write-all; nothing in this workflow writes anything.
permissions:
  contents: read

defaults:
  run:
    working-directory: web/launch

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/launch/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # swingbyy.com — the double-y domain is the one we actually own.
          # These used to build against api.swingbyapp.ca / swingbyapp.ca, which
          # nobody has registered (marketing/13-accounts-and-identity.md), so
          # the produced bundle pointed at a domain a stranger could buy.
          VITE_API_URL: https://swingbyy-api.onrender.com
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_PLAUSIBLE_DOMAIN: swingbyy.com
        run: npm run build

      - name: Check bundle size
        run: du -sh dist/

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/launch/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Audit at high+ severity. Moderate issues from transitive deps (exceljs→uuid, vite dev server)
      # are tracked but non-blocking at this stage.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  # SB-0056 — this job scans backend/app/ but lived in a workflow triggered
  # ONLY by web/launch/** changes, so it did not run for the 19-file security
  # commit it was meant to protect. A scan that cannot fire on the code it
  # covers is not a control. The trigger below now includes backend/** and the
  # workflow itself; the scan is unchanged.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        run: |
          if grep -rE "(SUPABASE_SERVICE_KEY|eyJhbGci[A-Za-z0-9+/]{20,}|sk_live_[A-Za-z0-9]+)" web/launch/ backend/app/ --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" --include="*.py" 2>/dev/null; then
            echo "::error::Potential secret found in source files"
            exit 1
          fi
          echo "No secrets found."
