<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Copy on this page is bound by hermes roles/FACTS.md. Rewritten
         2026-08-15: every tag below previously said "SwingBy" (the dead one-y
         name, §0), and claimed "trusted" providers, "the best pro" and
         "Verified reviews" — a verification gate that does not exist and
         ratings that have never been collected (§4, which bans inventing
         social proof). Do not reintroduce a quality adjective here. Describe
         the mechanism; the mechanism is the differentiator. -->
    <meta name="description" content="Post what needs doing. Calgary businesses see the job and your photos — not your name, address or budget — and send you their price. Launching October." />

    <!-- Open Graph.
         og:image was "/og-image.png" — relative, which no crawler resolves, and
         the file did not exist either: Cloudflare Pages' SPA fallback answered
         it 200 with text/html, so every share of swingbyy.com has rendered as a
         bare link with no card. Absolute URL + a real 1200x630 PNG now. -->
    <meta property="og:site_name" content="SwingByy" />
    <meta property="og:title" content="SwingByy — Post a job, get quotes from Calgary businesses" />
    <meta property="og:description" content="Post what needs doing. Calgary businesses see the job and your photos — not your name, address or budget — and send you their price. Launching October." />
    <meta property="og:image" content="https://swingbyy.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SwingByy — post a job, and Calgary businesses send you their price. Calgary, AB." />
    <meta property="og:url" content="https://swingbyy.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SwingByy — Post a job, get quotes from Calgary businesses" />
    <meta name="twitter:description" content="Post what needs doing. Calgary businesses see the job and your photos — not your name, address or budget — and send you their price. Launching October." />
    <meta name="twitter:image" content="https://swingbyy.com/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://swingbyy.com" />

    <!-- Theme color -->
    <meta name="theme-color" content="#07080a" />

    <title>SwingByy — Post a job, get quotes from Calgary businesses</title>
  </head>
