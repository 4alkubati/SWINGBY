<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SwingBy — Find trusted local service providers or grow your business. Coming soon to Calgary." />

    <!-- Open Graph.
         og:image was "/og-image.png" — relative, which no crawler resolves, and
         the file did not exist either: Cloudflare Pages' SPA fallback answered
         it 200 with text/html, so every share of swingbyy.com has rendered as a
         bare link with no card. Absolute URL + a real 1200x630 PNG now. -->
    <meta property="og:site_name" content="SwingBy" />
    <meta property="og:title" content="SwingBy — Local pros, on demand" />
    <meta property="og:description" content="Calgary's marketplace for cleaning, plumbing, lawn, and more. Post a job, get quotes, book the best pro." />
    <meta property="og:image" content="https://swingbyy.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SwingBy — the trust layer for local services. Calgary, AB." />
    <meta property="og:url" content="https://swingbyy.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SwingBy — Local pros, on demand" />
    <meta name="twitter:description" content="Calgary's marketplace for cleaning, plumbing, lawn, and more. Post a job, get quotes, book the best pro." />
    <meta name="twitter:image" content="https://swingbyy.com/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://swingbyy.com" />

    <!-- Theme color -->
    <meta name="theme-color" content="#07080a" />

    <!-- Analytics: Plausible -->
    <script defer data-domain="swingbyy.com" src="https://plausible.io/js/script.js"></script>

    <!-- GA4 placeholder -->
    <!-- <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script> -->

    <title>SwingBy — Local Services Marketplace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
