<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwingBy — Local services, trusted and simple</title>
    <meta name="description" content="SwingBy connects you with vetted local service businesses in Calgary. Post a job, get quotes, book with confidence. Safe escrow payments." />

    <!-- Social preview.
         These are duplicated by <SEO> (src/components/SEO.jsx), which sets
         richer per-route values — but Helmet writes them from JavaScript and
         the crawlers that matter (Facebook, Instagram, LinkedIn, WhatsApp,
         Slack) do not execute JS. Whatever is in this static head is the ONLY
         card those platforms will ever see, so the site keeps a correct default
         here and lets <SEO> improve on it for the ones that do run JS.
         og:image MUST be an absolute URL — a path like "/og-image.png" is not
         resolved by any of them. -->
    <meta property="og:site_name" content="SwingBy" />
    <meta property="og:title" content="SwingBy — Local services, trusted and simple" />
    <meta property="og:description" content="Calgary's marketplace for cleaning, plumbing, lawn care and more. Post a job, compare quotes, and pay through escrow." />
    <meta property="og:image" content="https://swingbyy.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SwingBy — the trust layer for local services. Calgary, AB." />
    <meta property="og:url" content="https://swingbyy.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_CA" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SwingBy — Local services, trusted and simple" />
    <meta name="twitter:description" content="Calgary's marketplace for cleaning, plumbing, lawn care and more. Post a job, compare quotes, and pay through escrow." />
    <meta name="twitter:image" content="https://swingbyy.com/og-image.png" />

    <link rel="canonical" href="https://swingbyy.com/" />
    <meta name="theme-color" content="#07080a" />

    <!-- Plausible analytics (privacy-first, no cookies) -->
    <script defer data-domain="swingbyy.com" src="https://plausible.io/js/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
