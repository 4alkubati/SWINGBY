<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwingByy — Post a job, get quotes from Calgary businesses</title>
        <!-- Copy here is bound by hermes roles/FACTS.md. Rewritten 2026-08-15:
         these tags said "SwingBy" (the dead one-y name, §0) and claimed
         "vetted" businesses, "trusted and simple" and "book with confidence" —
         quality adjectives about supply that nothing supports, and §4 bans.
         Describe the mechanism instead; the mechanism is what competitors
         cannot copy. -->
    <meta name="description" content="Post what needs doing. Calgary businesses see the job and your photos — not your name, address or budget — and send you their price." />

    <!-- Social preview.
         These are duplicated by <SEO> (src/components/SEO.jsx), which sets
         richer per-route values — but Helmet writes them from JavaScript and
         the crawlers that matter (Facebook, Instagram, LinkedIn, WhatsApp,
         Slack) do not execute JS. Whatever is in this static head is the ONLY
         card those platforms will ever see, so the site keeps a correct default
         here and lets <SEO> improve on it for the ones that do run JS.
         og:image MUST be an absolute URL — a path like "/og-image.png" is not
         resolved by any of them. -->
    <meta property="og:site_name" content="SwingByy" />
    <meta property="og:title" content="SwingByy — Post a job, get quotes from Calgary businesses" />
    <meta property="og:description" content="Post what needs doing. Calgary businesses see the job and your photos — not your name, address or budget — and send you their price." />
    <meta property="og:image" content="https://swingbyy.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SwingByy — post a job, and Calgary businesses send you their price. Calgary, AB." />
    <meta property="og:url" content="https://swingbyy.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_CA" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SwingByy — Post a job, get quotes from Calgary businesses" />
    <meta name="twitter:description" content="Post what needs doing. Calgary businesses see the job and your photos — not your name, address or budget — and send you their price." />
    <meta name="twitter:image" content="https://swingbyy.com/og-image.png" />

    <link rel="canonical" href="https://swingbyy.com/" />
    <meta name="theme-color" content="#07080a" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
