[pytest]
# SB-0065 — `tests/test_smoke_prod.py` documents itself as "marked with
# @pytest.mark.smoke so they can be skipped in CI by default". Nothing ever
# implemented that: there was no pytest.ini / pyproject / setup.cfg anywhere
# under backend/, the marker was not even registered (PytestUnknownMarkWarning),
# and its skip fixture only fires for an empty or localhost URL — while the
# default is the live https://swingbyy-api.onrender.com.
#
# So every `pytest backend/tests -q`, including CI's, made unauthenticated HTTP
# calls to production. A Render cold start turned Backend CI red for reasons
# unrelated to the commit, and because `test: needs: lint` already gates the
# suite, a red test job is indistinguishable from a real regression.
#
# Opt IN with `pytest -m smoke` when you actually mean to talk to a deployment.
markers =
    smoke: talks to a DEPLOYED environment over the network; deselected by default
addopts = -m "not smoke"
