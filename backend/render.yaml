services:
  - type: web
    name: swingby-api
    env: docker
    # Starter, not free. Corrected 2026-08-14 — the live service had already
    # been upgraded but this blueprint still said `free`, so re-applying it
    # would have silently downgraded production back.
    #
    # The free tier spins the instance down when idle and takes 30-60s to wake,
    # which is indistinguishable from "the app won't let me sign in" on a
    # client with a 30s timeout. Starter does not spin down. Do not put this
    # back on free to save money without also accepting that first-open is
    # broken for every user.
    plan: starter
    branch: main
    rootDir: backend
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      # Sentry's `environment` tag and /health's `environment` field both read
      # this, defaulting to "development" when unset (app/main.py). It was
      # never set here, so PRODUCTION reported itself as development and every
      # Sentry event from the live API was filed under the same environment as
      # a laptop run — which is why triaging SEN-1/SEN-2 meant guessing whether
      # an event came from a real user. Not a secret, so it is pinned in the
      # blueprint rather than set by hand in the dashboard.
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SWINGBY_ALLOWED_ORIGINS
        sync: false

      # SB-0025 — everything below was read by the app and declared nowhere.
      #
      # This blueprint listed 7 variables while the backend reads 55. Every
      # payment, email, captcha and error-reporting secret was invisible here,
      # so re-applying the blueprint, standing up a second environment, or
      # onboarding anyone meant discovering them by reading the source and
      # watching what 500s. `sync: false` means "set in the dashboard, do not
      # store here" — the declaration is the documentation; the value is not.
      #
      # Only production-relevant names are listed. Local-only tooling
      # (DEMO_SEED_PASSWORD, SMOKE_TIMEOUT, SWINGBY_ENV_FILE, TELEGRAM_/
      # DISCORD_/X_ credentials for the marketing scripts) is deliberately
      # absent; those live in .claude/secrets/ and backend/.env.example.

      # Supabase — newer projects issue the *_PUBLISHABLE / *_SECRET names.
      # supabase_client accepts either, and REFUSES to fall back to the
      # service-role key for auth calls (SB-0024), so a missing publishable key
      # now fails loudly at import instead of silently escalating privilege.
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

      # Trusted-proxy hop count for the rate limiter and the brute-force guard
      # (SB-0011/SB-0017). Render appends exactly one hop, which is also the
      # in-code default in production; set it explicitly if a CDN is put in
      # front, because counting too FEW hops reads attacker-controlled text.
      - key: TRUSTED_PROXY_HOPS
        value: "1"

      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_SOLO
        sync: false
      - key: STRIPE_PRICE_TEAM
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: STRIPE_PORTAL_RETURN_URL
        sync: false
      - key: STRIPE_CONNECT_RETURN_URL
        sync: false
      - key: STRIPE_CONNECT_REFRESH_URL
        sync: false
      - key: STRIPE_MERCHANT_IDENTIFIER
        sync: false

      # Email (Resend) and the contact inbox
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: CONTACT_INBOX_EMAIL
        sync: false

      # Captcha. NOTE: setting HCAPTCHA_SECRET is a ONE-WAY SWITCH today — the
      # backend starts requiring a token that no client sends yet (SB-0046).
      # Leave both unset until the clients send one.
      - key: HCAPTCHA_SECRET
        sync: false
      - key: HCAPTCHA_SITEKEY
        sync: false

      # Observability
      - key: SENTRY_DSN
        sync: false
      - key: POSTHOG_PROJECT_KEY
        sync: false
      - key: POSTHOG_HOST
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json

      # Gates the environment name and key-shape detail on /health behind a
      # token. Unset keeps the old public behaviour.
      - key: HEALTH_DIAGNOSTICS_TOKEN
        sync: false

      # Google
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_BUSINESS_CLIENT_ID
        sync: false
      - key: GOOGLE_BUSINESS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_BUSINESS_REDIRECT_URI
        sync: false

      # Auth redirects. A SCHEME-ONLY value (e.g. "exp://") is refused in
      # production — it would match every host under that scheme and reopen
      # pentest M-01 (SB-0020). Use the full prefix.
      - key: SOCIAL_AUTH_REDIRECT_PREFIXES
        sync: false
      - key: PASSWORD_RESET_REDIRECT_URL
        sync: false
      - key: BASE_URL
        sync: false

      # CRM sync (best effort; unset simply disables it)
      - key: NOTION_TOKEN
        sync: false
